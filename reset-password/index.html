<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spot a Paw — reset password</title>
<meta name="robots" content="noindex">
<script>
// Supabase puts the recovery token in the URL fragment. Older app builds
// send reset links to this domain; the app itself lives at spot-a-paw.com/app/ (and app.spot-a-paw.com, which Vodafone Egypt cannot reach).
// Forward everything, fragment included (a meta refresh would drop it).
location.replace('https://spot-a-paw.com/app/reset-password' + location.search + location.hash);
</script>
